<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | Star Elite</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="dash.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/x-icon" href="../ss.png">
    <script type="module" src="dash.js"></script>
    <script type="module" src="../js/website.js"></script>
    <link rel="stylesheet" href="../css/live-chat.css">


</head>

<body class="dash-body">

    <aside class="desktop-sidebar">
        <div class="sidebar-content">
            <div class="brand">
                <div class="logo">CN</div>
                <span>Star Elite</span>
            </div>
            <nav class="side-menu">
                <a href="#" class="nav-item active" data-tab="bookings"><i class="fa-solid fa-calendar"></i> Events</a>
                <a href="#" class="nav-item" data-tab="meet_greets"><i class="fa-solid fa-handshake"></i> Meetups</a>
                <a href="#" class="nav-item" data-tab="memberships"><i class="fa-solid fa-id-badge"></i> Clubs</a>
                <a href="#" class="nav-item" data-tab="celebrity_support"><i class="fa-solid fa-heart"></i> Support</a>
                <hr class="divider">
                <button id="editProfileBtn" class="nav-item btn-link"><i class="fa-solid fa-user-pen"></i> Edit
                    Profile</button>
                <button id="logoutBtn" class="nav-item logout"><i class="fa-solid fa-right-from-bracket"></i>
                    Logout</button>
            </nav>
        </div>
    </aside>

    <main class="main-viewport">
        <div class="content-wrapper">
            <header class="page-header">
                <div class="greeting">
                    <h1 id="userName">Hello...</h1>
                    <div class="sub-info">
                        <span id="userSub">Manage your celebrity interactions</span>
                        <span id="userCountry" class="country-tag"></span>
                    </div>
                </div>
                <div class="header-action-mobile">
                    <button id="logoutBtnMobile" class="icon-btn"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </header>

            <section class="stats-row">
                <div class="stat-pill">
                    <span class="val" id="countBookings">0</span>
                    <span class="lab">Bookings</span>
                </div>
                <div class="stat-pill">
                    <span class="val" id="countMeetups">0</span>
                    <span class="lab">Meetups</span>
                </div>
                <div class="stat-pill highlight">
                    <span class="val" id="countSupport">$0</span>
                    <span class="lab">Invested</span>
                </div>
            </section>

            <section class="data-section">
                <div class="section-head">
                    <h2 id="currentTabTitle">Event Bookings</h2>
                </div>
                <div class="table-card">
                    <div id="tableResponse" class="responsive-table">
                    </div>
                </div>
            </section>
        </div>
    </main>

    <nav class="mobile-nav">
        <button class="m-nav-item active" data-tab="bookings"><i
                class="fa-solid fa-calendar"></i><span>Events</span></button>
        <button class="m-nav-item" data-tab="meet_greets"><i
                class="fa-solid fa-handshake"></i><span>Meetups</span></button>
        <button class="m-nav-item" data-tab="memberships"><i
                class="fa-solid fa-id-badge"></i><span>Clubs</span></button>
        <button class="m-nav-item" id="editProfileBtnMobile"><i
                class="fa-solid fa-user"></i><span>Profile</span></button>
    </nav>


    <script type="module" src="../js/live-chat.js"></script>

    <!-- LiveChat Scoped UI Panel -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="css/live-chat.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- LiveChat Scoped UI Panel -->
    <div class="lc-widget-launcher-wrapper">
        <!-- Popup Toaster Notification -->
        <div id="chat-toaster" class="lc-widget-toaster-popup">
            <span>Need help? Chat with us!</span>
            <button type="button" id="close-chat-toaster" class="lc-widget-toaster-close-btn"
                title="Dismiss">&times;</button>
        </div>

        <!-- Floating Trigger Bubble -->
        <button type="button" id="live-chat-trigger-bubble" class="lc-widget-bubble-launcher" title="Chat with support">
            <i class="fa fa-comments"></i>
        </button>
    </div>

    <!-- Slide-in Chat UI Panel -->
    <div class="lc-widget-drawer-overlay" id="chatDrawerOverlay"></div>
    <div class="lc-widget-drawer" id="chatDrawer">
        <div class="lc-widget-drawer-header">
            <div class="lc-widget-title">
                <i data-lucide="message-square"></i>
                <span>Support Channel</span>
            </div>
            <div class="lc-widget-header-actions" style="display: flex; align-items: center; gap: 8px;">
                <!-- Logout Button (Only visible when user is logged in) -->
                <button type="button" id="chatLogoutBtn" class="lc-widget-action-btn" title="Log Out"
                    style="display: none; background: transparent; border: none; color: #ef4444; cursor: pointer;">
                    <i data-lucide="log-out"></i>
                </button>
                <button type="button" id="closeChatDrawerBtn" class="lc-widget-action-btn" title="Close Chat">
                    <i data-lucide="x"></i>
                </button>
            </div>
        </div>

        <div class="lc-widget-feed-container" id="chat-message-feed">
            <!-- Dynamically Hydrated by live-chat.js -->
        </div>

        <div class="lc-widget-drawer-footer">
            <input type="file" id="chat-image-attachment-input" style="display: none;" accept="image/*">
            <button type="button" id="chat-attachment-trigger-btn" class="lc-widget-tool-btn"
                title="Attach Document/Image">
                <i data-lucide="paperclip"></i>
            </button>
            <textarea id="chat-terminal-text-field" class="lc-widget-input-field" placeholder="Type a message..."
                rows="1"></textarea>
            <button type="button" id="chat-send-message-btn" class="lc-widget-send-btn">
                <i data-lucide="send"></i>
            </button>
        </div>
    </div>

</body>

</html>
