<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            background: url('https://illustrations.popsy.co/gray/web-error.svg') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #2c3e50;
            padding: 20px;
        }

        .content {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .content h1 {
            font-size: 6rem;
            color: #ff6b6b;
        }

        .content h2 {
            font-size: 2rem;
            margin: 10px 0;
        }

        .content p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: #1e90ff;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0f78d1;
        }

        @media (max-width: 600px) {
            .content h1 {
                font-size: 4rem;
            }

            .content h2 {
                font-size: 1.5rem;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="content">
        <h1>404</h1>
        <h2>Oops! We Are Offline</h2>
        <p id="mees">The website is currently undergoing maintenance or offline.</p>
        <a href="404.html" class="btn" onclick="location.reload(); return false;">Refresh page</a>
    </div>

    <script>
        const API_WEB_BASE = 'https://celeb-address.vercel.app/api/web';
        const FRONTEND_SIGNATURE = 'starelite';

        async function checkVisibility() {
            try {
                const res = await fetch(`${API_WEB_BASE}/status?signature=${FRONTEND_SIGNATURE}`);
                const data = await res.json();

                if (data.success && data.website_visibility === true) {
                    // Admin turned site back on: auto return to index.html
                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error("Status check failed:", err);
            }
        }

        // Check on load
        checkVisibility();

        // Poll every 5 seconds to automatically redirect home when site goes online
        setInterval(checkVisibility, 50000);
    </script>
</body>

</html>
